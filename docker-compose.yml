services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: express_showcase
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "if (!db.adminCommand('ping').ok) quit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  mongo-data:
